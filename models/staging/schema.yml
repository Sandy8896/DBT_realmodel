version: 2

models:

  - name: stg_customers
    description: "Cleaned and renamed customers from the raw seed."
    columns:
      - name: customer_id
        description: "Natural PK from source system."
        tests: [unique, not_null]
      - name: email
        tests: [unique, not_null]
      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['US', 'UK', 'IN', 'DE', 'AU', 'CA']

  - name: stg_orders
    description: "Cleaned orders with order_size label."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        tests:
          - accepted_values:
              values: ['completed', 'pending', 'cancelled', 'returned']

  - name: stg_events
    description: "Parsed clickstream events."
    columns:
      - name: event_id
        tests: [unique, not_null]
