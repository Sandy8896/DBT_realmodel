# ──────────────────────────────────────────────────────────────
# profiles.yml  →  place this at  ~/.dbt/profiles.yml
# Using DuckDB so you need ZERO external database setup.
#
# Install adapter:  pip install dbt-duckdb
# ──────────────────────────────────────────────────────────────
dbt_learning_project:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "dbt_learning.duckdb"   # created in project root
      threads: 4

    # Swap to postgres when ready:
